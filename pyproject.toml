[project]
name = "caliper"
version = "0.1.0"
description = "Trustworthy uncertainty for surrogate models"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-learn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["caliper"]